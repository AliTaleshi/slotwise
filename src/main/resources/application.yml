spring:
  application:
    name: slotwise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slotwise}
    username: ${DB_USER:slotwise}
    password: ${DB_PASSWORD:slotwise}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  health:
    mail:
      # a mail outage must not take the app out of load balancers; emails are best-effort
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

slotwise:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: slotwise
    access-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-ttl: ${JWT_REFRESH_TTL:14d}
  booking:
    hold-ttl: ${HOLD_TTL:10m}
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:Slotwise <no-reply@slotwise.local>}
  scheduling:
    enabled: true
  jobs:
    reminders-interval: PT1M
    hold-cleanup-interval: PT1M
    webhook-retry-interval: PT30S
  webhooks:
    allow-private-targets: ${WEBHOOKS_ALLOW_PRIVATE_TARGETS:false}
    timeout: 5s
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    public-per-minute: ${RATE_LIMIT_PUBLIC_PER_MINUTE:60}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
